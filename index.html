<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Causal Synthetic Data Generator</title>
<meta name="description" content="Draw a causal graph, generate a synthetic table from it, and see how fairness cuts, hidden confounders and privacy exposure play out in the data and in models trained on it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 9L23 16M9 9L9 23M9 23L23 16' stroke='%232f56c9' stroke-width='2.5'/%3E%3Ccircle cx='9' cy='9' r='5' fill='%23b8396f'/%3E%3Ccircle cx='9' cy='23' r='5' fill='%2311845d'/%3E%3Ccircle cx='23' cy='16' r='5' fill='%23a86f00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a lab bench. Inspector | graph-paper canvas | analysis tabs, with the generated table as a strip underneath. */
:root{
  --bg:#eef1f4; --panel:#fbfcfd; --paper:#f7f9fb; --grid:#e0e5eb;
  --ink:#16202b; --ink-2:#465262; --muted:#76818e; --line:#dce2e8; --line-2:#c3cbd5;
  --accent:#2f56c9; --accent-ink:#ffffff; --accent-wash:#e3eafb;
  --edge:#3b4654; --und:#0e7f86; --und-wash:rgba(14,127,134,.10);
  --r-protected:#b8396f; --r-admissible:#11845d; --r-outcome:#a86f00; --r-other:#6a7684; --r-hidden:#8b939d;
  --bad:#c23636; --bad-wash:#fbe9e8; --good:#11845d; --good-wash:#e4f3ec; --warn:#a86f00;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --seq-lo:#e9f0fb; --seq-hi:#104281; --seqp-lo:#86b6ef; --seqp-hi:#0d366b;
  --on-strong:#ffffff;
  --font-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --font-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#161b21; --paper:#12171c; --grid:#1f262e;
    --ink:#e6eaef; --ink-2:#aab4bf; --muted:#7c8793; --line:#252d36; --line-2:#35404c;
    --accent:#6f93ff; --accent-ink:#0b1020; --accent-wash:#1c2640;
    --edge:#b7c0cb; --und:#3cc3c9; --und-wash:rgba(60,195,201,.11);
    --r-protected:#e46aa1; --r-admissible:#35b98b; --r-outcome:#e3a72b; --r-other:#8d99a7; --r-hidden:#7a838e;
    --bad:#ee6b6b; --bad-wash:#3a1d1f; --good:#35b98b; --good-wash:#14302a; --warn:#e3a72b;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --seq-lo:#1b232e; --seq-hi:#7fb3f0; --seqp-lo:#184f95; --seqp-hi:#cde2fb;
    --on-strong:#0b1020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#161b21; --paper:#12171c; --grid:#1f262e;
  --ink:#e6eaef; --ink-2:#aab4bf; --muted:#7c8793; --line:#252d36; --line-2:#35404c;
  --accent:#6f93ff; --accent-ink:#0b1020; --accent-wash:#1c2640;
  --edge:#b7c0cb; --und:#3cc3c9; --und-wash:rgba(60,195,201,.11);
  --r-protected:#e46aa1; --r-admissible:#35b98b; --r-outcome:#e3a72b; --r-other:#8d99a7; --r-hidden:#7a838e;
  --bad:#ee6b6b; --bad-wash:#3a1d1f; --good:#35b98b; --good-wash:#14302a; --warn:#e3a72b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --seq-lo:#1b232e; --seq-hi:#7fb3f0; --seqp-lo:#184f95; --seqp-hi:#cde2fb;
  --on-strong:#0b1020;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px 32px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font:600 15px var(--font-ui);margin:0}
h3{font:600 13px var(--font-ui);margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:4px 12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font:700 22px/1 var(--font-display);letter-spacing:-.015em}
.brand span{font:500 11px var(--font-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{font:600 10.5px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--panel);flex-wrap:nowrap}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.38;cursor:not-allowed}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
input[type=number],input[type=text],select{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:4px 7px;font-size:13px;min-width:0}
input[type=number]{width:84px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.inline{display:inline-flex;align-items:center;gap:6px}

/* bench */
.bench{display:grid;grid-template-columns:272px minmax(0,1fr) 440px;gap:12px;align-items:start}
@media (max-width:1280px){.bench{grid-template-columns:264px minmax(0,1fr)}.analysis{grid-column:1/-1}}
@media (max-width:780px){.bench{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}

/* inspector */
.inspector{padding:14px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.help{font-size:12px;color:var(--ink-2);line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.roles button{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:5px 8px;font-size:12.5px;cursor:pointer;text-align:left}
.roles button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:600 10px var(--font-mono);color:var(--on-strong);flex:none}
.c-protected{background:var(--r-protected)}.c-admissible{background:var(--r-admissible)}.c-outcome{background:var(--r-outcome)}.c-other{background:var(--r-other)}.c-hidden{background:transparent;color:var(--r-hidden);box-shadow:inset 0 0 0 1.5px var(--r-hidden)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.ins-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2)}
.ends{font:500 14px var(--font-mono);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.measure{background:var(--accent-wash);border-radius:7px;padding:8px 10px;font-size:12.5px}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}

/* canvas */
.canvas-pane{overflow:hidden}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;padding:9px 10px;border-bottom:1px solid var(--line);align-items:center}
.tools .hint{font-size:12px;color:var(--muted);margin-left:auto}
.paper{background:var(--paper)}
svg#graph{display:block;width:100%;height:auto;aspect-ratio:900/580;touch-action:none;user-select:none;-webkit-user-select:none}
#graph .gridline{stroke:var(--grid);stroke-width:1;fill:none}
#graph .node{cursor:grab}
#graph .node .body{fill:var(--panel);stroke-width:2.5}
#graph .node .halo{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
#graph .node.sel .halo{opacity:1}
#graph .node .nm{font:600 12px var(--font-ui);fill:var(--ink);text-anchor:middle}
#graph .node .ty{font:400 10px var(--font-mono);fill:var(--muted);text-anchor:middle}
#graph .badge text{font:600 9.5px var(--font-mono);fill:var(--on-strong);text-anchor:middle;dominant-baseline:central}
#graph .role-protected .body{stroke:var(--r-protected)}#graph .role-protected .badge circle{fill:var(--r-protected)}
#graph .role-admissible .body{stroke:var(--r-admissible)}#graph .role-admissible .badge circle{fill:var(--r-admissible)}
#graph .role-outcome .body{stroke:var(--r-outcome)}#graph .role-outcome .badge circle{fill:var(--r-outcome)}
#graph .role-other .body{stroke:var(--r-other)}#graph .role-other .badge circle{fill:var(--r-other)}
#graph .role-hidden .body{stroke:var(--r-hidden);stroke-dasharray:5 4;fill:var(--paper)}#graph .role-hidden .badge circle{fill:var(--paper);stroke:var(--r-hidden);stroke-width:1.5}#graph .role-hidden .badge text{fill:var(--r-hidden)}
#graph .handle{cursor:crosshair;opacity:0;transition:opacity .12s}
#graph .handle circle{fill:var(--accent);stroke:var(--paper);stroke-width:2}
#graph .handle path{stroke:var(--accent-ink);stroke-width:1.8;fill:none}
#graph .node:hover .handle,#graph .node.sel .handle{opacity:1}
@media (hover:none){#graph .node .handle{opacity:.85}}
#graph .edge{cursor:pointer}
#graph .edge .hit{stroke:transparent;stroke-width:16;fill:none}
#graph .edge .vis{fill:none;stroke-linecap:round}
#graph .edge.dir .vis{stroke:var(--edge)}
#graph .edge.und .vis{stroke:var(--und)}
#graph .edge.sel .vis{stroke:var(--accent)}
#graph .edge.err .vis{stroke:var(--bad)}
#graph .edge.cut .vis{stroke:var(--bad);stroke-dasharray:3 5}
#graph .edge .scis{font-size:15px;fill:var(--bad);text-anchor:middle;dominant-baseline:central;pointer-events:none}
#graph .edge .scis-bg{fill:var(--paper);stroke:var(--bad);stroke-width:1.2}
.cuts{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin:6px 0}
.cuts dt{font-weight:600}.cuts dd{margin:0;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.cuts dt.on{color:var(--bad)}
#graph .edge .pill rect{fill:var(--paper);stroke:var(--line-2)}
#graph .edge.sel .pill rect{stroke:var(--accent)}
#graph .edge .pill text{font:500 10px var(--font-mono);fill:var(--ink-2);text-anchor:middle;dominant-baseline:central}
#graph .clique polygon{fill:var(--und-wash);stroke:var(--und-wash);stroke-linejoin:round}
#graph .clique text{font:600 10.5px var(--font-ui);fill:var(--und);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase}
#graph .tmp{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4;fill:none}
#graph .empty-msg{font:500 14px var(--font-ui);fill:var(--muted);text-anchor:middle}
.status{padding:8px 12px;border-top:1px solid var(--line);font:12px/1.5 var(--font-mono);color:var(--ink-2);display:flex;flex-direction:column;gap:3px;min-height:36px}
.status .err{color:var(--bad)}
.status .warn{color:var(--warn)}
.legend-inline{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend-inline svg{vertical-align:middle}

/* analysis */
.analysis{display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:10px 6px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabbody{padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.hm-wrap{overflow-x:auto}
.hm-wrap svg text{font:500 10.5px var(--font-mono);fill:var(--ink-2)}
.hm-wrap svg .hid{fill:var(--muted);font-style:italic}
.hm-wrap svg .cell{stroke:var(--panel);stroke-width:2}
.hm-wrap svg .cellnum{font:500 9.5px var(--font-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hm-wrap svg .edgemark{fill:none;stroke:var(--r-outcome);stroke-width:1.6;pointer-events:none}
.scale{display:flex;align-items:center;gap:8px;font:11px var(--font-mono);color:var(--muted)}
.scale i{display:block;height:8px;flex:1;max-width:180px;border-radius:4px}
.ci{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.zchips{display:flex;flex-wrap:wrap;gap:5px}
.zchips button{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer}
.zchips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.verdict{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.vbox .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.vbox .v{font:600 15px var(--font-mono)}
.vbox .s{font-size:12px;color:var(--ink-2)}
.pair{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:12px}
.pair-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pair-head .mono{font-size:13px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.bar .val{white-space:nowrap}
.bar .track{height:12px;background:var(--grid);border-radius:0 4px 4px 0;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0}
.bar .lab{font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .val{font-family:var(--font-mono);text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.paths{display:flex;flex-direction:column;gap:4px}
.path{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:12px;padding:5px 8px;border-radius:6px;background:var(--paper)}
.path .p{font-family:var(--font-mono);overflow-wrap:anywhere}
.path .kind{color:var(--muted);font-size:11px}
.tag{font:600 10.5px var(--font-ui);letter-spacing:.04em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.open{background:var(--bad-wash);color:var(--bad)}
.tag.blocked{background:var(--good-wash);color:var(--good)}
.tag.neutral{background:var(--grid);color:var(--ink-2)}
.margs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.marg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.marg .h{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;min-width:0}
.marg .h span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marg .sub{font:11px var(--font-mono);color:var(--muted)}
.marg svg{display:block;width:100%;height:56px}
.emb-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.emb-controls .field.wide{grid-column:1/-1}
#graph .edge .pill.flip rect{stroke:var(--bad);fill:var(--bad-wash)}
#graph .edge .pill.flip text{fill:var(--bad)}
.tools .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.measure .flipnote{display:block;margin-top:6px;color:var(--bad);font-weight:600}
.mlwrap{overflow-x:auto}
table.mlt{border-collapse:collapse;width:100%;font:12px var(--font-mono);font-variant-numeric:tabular-nums}
table.mlt th{text-align:right;font:600 10.5px var(--font-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 0 6px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.mlt td{text-align:right;padding:5px 0 5px 10px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap;vertical-align:top}
table.mlt th:first-child,table.mlt td:first-child{text-align:left;padding-left:0}
table.mlt td:first-child{font-family:var(--font-ui);color:var(--ink-2);white-space:normal}
table.mlt td .s{display:block;font:11px var(--font-ui);color:var(--muted)}
table.mlt td .s.up{color:var(--bad)}
table.mlt td .s.down{color:var(--good)}
table.mlt tr.sec td{font:600 10.5px var(--font-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:12px;border-bottom-color:var(--line-2)}
.imp{display:grid;grid-template-columns:minmax(56px,110px) minmax(0,1fr) minmax(0,1fr);gap:6px 12px;align-items:center;font-size:12px}
.imp .hd{font:600 10.5px var(--font-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.imp .hd i{display:inline-block;width:10px;height:10px;border-radius:3px}
.imp .lab{font-family:var(--font-mono);display:flex;gap:5px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.imp .lab .chip{width:15px;height:15px;font-size:8.5px}
.imp .cell{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:6px;align-items:center}
.imp .track{height:10px;background:var(--grid);border-radius:0 4px 4px 0;position:relative}
.imp .fill{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0}
.imp .val{font:11px var(--font-mono);color:var(--ink-2);text-align:right}
.emb-stage{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--paper);aspect-ratio:1/1;max-width:100%}
.emb-stage canvas{display:block;width:100%;height:100%;border-radius:8px}
.emb-stage .ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-size:13px;color:var(--muted);pointer-events:none}
.stale{font:600 11px var(--font-ui);color:var(--warn);letter-spacing:.04em}
.swatches{display:flex;flex-wrap:wrap;gap:6px 12px;font:11.5px var(--font-mono);color:var(--ink-2)}
.swatches i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* table strip */
.strip{margin-top:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.strip-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tablewrap{overflow-x:auto}
table.prev{border-collapse:collapse;font:12px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.prev th{text-align:left;font:600 11.5px var(--font-ui);padding:4px 12px 6px 0;border-bottom:1px solid var(--line-2);color:var(--ink)}
table.prev th .chip{width:15px;height:15px;font-size:8.5px;margin-right:5px;vertical-align:-3px}
table.prev td{padding:3px 12px 3px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}

#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--panel);font:12px/1.4 var(--font-mono);padding:6px 8px;border-radius:6px;max-width:280px;opacity:0;transition:opacity .08s}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:13px;max-width:min(560px,calc(100vw - 32px));opacity:0;transition:opacity .15s;pointer-events:none}
#toast.show{opacity:1}
#toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cf-intro{background:var(--accent-wash);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.callout{border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.5}
.pairsel{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.decomp{display:flex;gap:2px;height:12px;border-radius:0 4px 4px 0;overflow:hidden}
.decomp i{display:block;height:100%;min-width:2px}
table.mlt.ex td,table.mlt.ex th{padding-left:8px}
table.mlt.wrap th{white-space:normal;vertical-align:bottom}
table.mlt.ex tr.real td{border-bottom:0;color:var(--ink-2)}
table.mlt.ex tr.alt td{border-bottom:1px solid var(--line-2)}
table.mlt.ex td:first-child{white-space:nowrap;font-size:11.5px}
table.mlt.ex td.chg{background:var(--accent-wash);color:var(--ink);font-weight:600}
table.mlt.ex .ycol{box-shadow:inset 1px 0 0 var(--r-outcome),inset -1px 0 0 var(--r-outcome)}
details.how{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px}
details.how summary{cursor:pointer;font-weight:600}
details.how ul{margin:8px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
#graph .modline{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:2 4;fill:none;stroke-linecap:round}
#graph .moddot{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5}
.zchips.lv button{font-family:var(--font-mono)}
.ds-note { margin: 4px 0 10px; }
details.codes { margin: 0 0 12px; font-size: 12px; }
details.codes summary { cursor: pointer; color: var(--muted); }
details.codes table { margin-top: 6px; width: 100%; }
details.codes td { padding: 2px 6px; }

        <div class="vbox"><span class="k">Conditional gap</span><span class="v">${cf == null ? '—' : unit(cf)}</span><span class="s">${Aids.length ? (cf == null ? 'no stratum has two groups with 10+ rows' : `within strata of ${A.map(a => esc(a.name)).join(', ')}; ${(cover * 100).toFixed(0)}% of rows usable`) : 'mark admissible nodes to condition on'}</span></div>

// Groups formed by combining every categorical protected attribute (e.g. gender × race).
function intersectHTML(S, Y, Aids) {

      <div class="stats">

        mh += `<div class="mlwrap"><table class="mlt wrap"><thead><tr><th>Model</th><th>${R.cls ? 'Predicted positive' : 'Mean prediction'}</th><th>${R.cls ? 'Answers that change' : 'Avg change'}</th>${C.frz.size ? `<th>Change, ${C.A.map(esc).join(', ')} held</th>` : ''}</tr></thead><tbody>
          ${M.rows.map((x, k) => `<tr><td>${nm[k]}</td><td>${rateF(x.p0)} → ${rateF(x.p1)}</td><td>${R.cls ? pct(x.fl) : x.ad.toFixed(2)}</td>${C.frz.size ? `<td>${x.flF == null ? '—' : pct(x.flF)}</td>` : ''}</tr>`).join('')}
          </tbody></table></div><p class="note">On the ${M.n.toLocaleString()} held-out test rows in ${ga}, with each model's real cutoff. ${ml.features === 'nos' ? `These models never see ${sn}, yet their predictions still move when the columns ${sn} causes move.` : `Try “Without S”: a model that never sees ${sn} still changes its answer when the columns ${sn} causes change.`}</p>`;
      }
    } else {
      mh += `<p class="note">Training the two models…</p>`;
      needTrain = true;
    }
    h += mh + '</div>';
  }
  h += `<details class="how"><summary>How to read this tab</summary><ul>
    <li><b>Arrows are causes.</b> S → X means switching S moves X. S — X only says they move together, so by default X stays put.</li>
    <li><b>Counterfactual fairness</b> (Kusner et al., 2017): a decision is fair to a person if it would be the same had they been in another group. “Individual outcomes that change” measures how far the table is from that.</li>
    <li><b>Holding the admissible columns fixed</b> lets S act through them, since you've said that route is acceptable, and blocks every other route. This is the path-specific version, the counterfactual cousin of the conditional gap in Fairness.</li>
    <li><b>Parity gap vs caused gap.</b> The table's gap mixes S's own effect with differences the groups have anyway. The split above separates them, which observed data alone can't do. When nothing causes S, the “not caused” part should be near 0; a couple of points is sampling noise from the groups' different make-up.</li>
    <li><b>The answer depends on the arrows.</b> Two graphs can produce identical tables yet give different counterfactuals, so a counterfactual-fairness claim about real data always rests on an assumed graph.</li>
    <li>Computed on the first ${C.m.toLocaleString()} rows; the models on their held-out test rows. A switched category keeps each person's position inside the group's band.</li></ul></details>`;
  body.innerHTML = h;
  bindCF();
  if (needTrain) ensureML(() => { if (tab === 'cf') renderCF(); });
}
function bindCF() {
  const re = () => renderCF();
  const on = (sel, f) => { const el = body.querySelector(sel); if (el) el.addEventListener('change', f); };
  on('#cf-s', ev => { cf.s = +ev.target.value; cf.a = cf.b = null; re(); });
  on('#cf-y', ev => { ml.target = +ev.target.value; re(); });
  on('#cf-a', ev => { const v = +ev.target.value; if (v === cf.b) cf.b = cf.a; cf.a = v; re(); });
  on('#cf-b', ev => { const v = +ev.target.value; if (v === cf.a) cf.a = cf.b; cf.b = v; re(); });
  const sw = body.querySelector('#cf-swap'); if (sw) sw.addEventListener('click', () => { [cf.a, cf.b] = [cf.b, cf.a]; re(); });
  body.querySelectorAll('.seg').forEach(sg => sg.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.set === 'und') cf.und = b.dataset.v; else if (b.dataset.set === 'features') ml.features = b.dataset.v;
    re();
  }));
}

/* ---------------- preview table ---------------- */
function renderPreview() {
  const el = $('#preview');
  if (!DATA) { el.innerHTML = '<p class="note">No table yet.</p>'; $('#strip-note').textContent = ''; return; }
  const cols = exportCols(), rows = Math.min(10, DATA.N);
  let h = `<table class="prev"><thead><tr>${cols.map(c => `<th><span class="chip c-${c.n.role}">${ROLE_SHORT[c.n.role]}</span>${esc(c.col)}</th>`).join('')}</tr></thead><tbody>`;
  for (let r = 0; r < rows; r++) h += `<tr>${cols.map(c => `<td>${fmtVal(c.n, r)}</td>`).join('')}</tr>`;
  el.innerHTML = h + '</tbody></table>';
  const hid = DATA.nodes.filter(n => n.role === 'hidden').length;
  $('#strip-note').textContent = `First ${rows} of ${DATA.N.toLocaleString()} rows · ${cols.length} columns${hid ? ` · ${hid} hidden node${hid > 1 ? 's' : ''} left out` : ''}. Categorical values are codes 0…k−1.`;
}

/* ---------------- boot ---------------- */
const BOOT = new URLSearchParams(location.search), BOOT_EX = BOOT.get('example');
if (BOOT_EX && (TEMPLATES[BOOT_EX] || isDsKey(BOOT_EX))) {
  restore(); if (isDsKey(BOOT_EX)) loadDs(BOOT_EX); else TEMPLATES[BOOT_EX]();
  if (+BOOT.get('rows') > 0) N = Math.round(+BOOT.get('rows')); if (+BOOT.get('seed') > 0) SEED = Math.round(+BOOT.get('seed'));
  save();
} else if (!restore()) TEMPLATES.hiring();
syncTop(); renderGraph(); renderInspector(); regenerate();
// A PCA at rest, so the embedding tab opens on a picture rather than an empty box.
setTimeout(() => {
  if (!DATA || emb.result) return;
  const {X, d} = buildMatrix(Math.min(emb.cap, DATA.N));
  if (d) { emb.result = pca(X, d); emb.dataRef = DATA; emb.stale = false; }
  if (tab === 'emb') renderEmb();
}, 50);
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const redraw = () => { renderAnalysis(); };
try { mq.addEventListener('change', redraw); } catch (e) {}
new MutationObserver(redraw).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
window.addEventListener('resize', () => { if (tab === 'emb') drawEmb(); });
if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
})();
</script>
